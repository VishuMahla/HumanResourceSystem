<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/Css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <section id="Dashboard">
        <h1>🏠 Dashboard</h1>
        <button id="mode">mode</button>
        <button>notifications</button>
        <select name="menuitems" id="admin">
            <option value="adminname">admin name</option>
            <option value="logout">logout</option>
        </select>
    </section>
    <section id="searchbar">
        <input type="text" id="searchInput" placeholder="search by Id or name....">
        <div id="suggestions"></div>
        <select name="departments" id="deptmenu">
            <option value="All Departments">All Departments</option>
            <option value="humanResource">Human Resources</option>
            <option value="development">Development</option>
            <option value="testing">Testing</option>
            <option value="finance">Finance</option>
            <option value="marketing">Marketing</option>
        </select>
        <select name="statusofday" id="stat">
            <option value="present">Present</option>
            <option value="absent">Absent</option>
            <option value="onleave">On Leave</option>
        </select>
        <button id="search">🔍︎ Search</button>
        <button id="reset">Reset</button>
    </section>
    <section>
        <button id="addemp">+ Add Employee</button>
        <table id="employeestable">
            <thead>
                <tr>
                    <th>Employee ID</th>
                    <th>Employee Name</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Salary</th>
                    <th>Attendance status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tablebody">
                
            </tbody>
        </table>
        <p id="entryCount"></p>
    </section>
    <script src="./JS/Data.js"></script>
    <script src="./JS/dashboard.js">
    </script>

</body>
</html>
